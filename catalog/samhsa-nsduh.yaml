title: SAMHSA National Survey on Drug Use and Health (NSDUH)
description: |
  The main U.S. federal survey of tobacco, alcohol and drug use, substance use disorders, mental health and treatment among the civilian noninstitutionalized population aged 12 and older, with national, state and substate reports, detailed tables and public-use microdata files.
